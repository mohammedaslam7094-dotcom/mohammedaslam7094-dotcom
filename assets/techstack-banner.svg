<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots3" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="#0b1020"/>
  <rect width="1200" height="520" fill="url(#dots3)"/>
  <circle cx="600" cy="260" r="420" fill="url(#glow)"/>

  <rect x="470" y="28" width="260" height="52" fill="#22d3ee"/>
  <text x="600" y="64" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="#0b1020">TECH STACK</text>

  <!-- category labels -->
  <text x="60" y="130" font-family="Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#a5b4fc">FRONTEND</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#f97316">BACKEND</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#22d3ee">DATABASE</text>
  <text x="60" y="470" font-family="Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#c084fc">TOOLS &amp; AI-ASSISTED DEV</text>

  <!-- Frontend row -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#0b1020" text-anchor="middle">
    <g filter="url(#shadow3)">
      <circle cx="230" cy="118" r="34" fill="#61dafb"/><text x="230" y="123">React</text>
      <circle cx="320" cy="118" r="34" fill="#61dafb"/><text x="320" y="123">RN</text>
      <circle cx="410" cy="118" r="34" fill="#e34f26"/><text x="410" y="123" fill="#fff">HTML5</text>
      <circle cx="500" cy="118" r="34" fill="#264de4"/><text x="500" y="123" fill="#fff">CSS3</text>
      <circle cx="590" cy="118" r="34" fill="#f7df1e"/><text x="590" y="123">JS</text>
      <circle cx="680" cy="118" r="34" fill="#38bdf8"/><text x="680" y="123" fill="#fff">Tailwind</text>
    </g>
  </g>

  <!-- Backend row -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    <g filter="url(#shadow3)">
      <circle cx="230" cy="238" r="34" fill="#3c873a"/><text x="230" y="243" fill="#fff">Node</text>
      <circle cx="320" cy="238" r="34" fill="#000000"/><text x="320" y="243" fill="#fff">Express</text>
      <circle cx="410" cy="238" r="34" fill="#e0234e"/><text x="410" y="243" fill="#fff">Nest</text>
      <circle cx="500" cy="238" r="34" fill="#777bb4"/><text x="500" y="243" fill="#fff">PHP</text>
      <circle cx="590" cy="238" r="34" fill="#ff2d20"/><text x="590" y="243" fill="#fff">Laravel</text>
    </g>
  </g>

  <!-- Database row -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
    <g filter="url(#shadow3)">
      <circle cx="230" cy="358" r="34" fill="#336791"/><text x="230" y="363" fill="#fff">Postgres</text>
      <circle cx="320" cy="358" r="34" fill="#4479a1"/><text x="320" y="363" fill="#fff">MySQL</text>
      <circle cx="410" cy="358" r="34" fill="#2d3748"/><text x="410" y="363" fill="#fff">Prisma</text>
    </g>
  </g>

  <!-- Tools row -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
    <g filter="url(#shadow3)">
      <circle cx="410" cy="458" r="34" fill="#f05032"/><text x="410" y="463" fill="#fff">Git</text>
      <circle cx="500" cy="458" r="34" fill="#181717"/><text x="500" y="463" fill="#fff">GitHub</text>
      <circle cx="590" cy="458" r="34" fill="#007acc"/><text x="590" y="463" fill="#fff">VS Code</text>
      <circle cx="680" cy="458" r="34" fill="#21759b"/><text x="680" y="463" fill="#fff">WP</text>
      <circle cx="770" cy="458" r="34" fill="#111111"/><text x="770" y="463" fill="#fff">Cursor</text>
      <circle cx="860" cy="458" r="34" fill="#d97757"/><text x="860" y="463" fill="#fff">Claude</text>
    </g>
  </g>

  <!-- connecting lines to suggest a stack/constellation -->
  <g stroke="#6366f1" stroke-width="1.5" opacity="0.35">
    <line x1="230" y1="152" x2="230" y2="204"/>
    <line x1="320" y1="152" x2="320" y2="204"/>
    <line x1="230" y1="272" x2="230" y2="324"/>
    <line x1="320" y1="272" x2="410" y2="324"/>
  </g>
</svg>
