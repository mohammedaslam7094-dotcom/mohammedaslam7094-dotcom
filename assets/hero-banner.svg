<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#151233"/>
    </linearGradient>
    <linearGradient id="slabGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <pattern id="dotsDark" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0b1020" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <polygon points="820,0 1200,0 1200,320 660,320" fill="url(#slabGrad)"/>
  <polygon points="820,0 1200,0 1200,320 660,320" fill="url(#dotsDark)"/>

  <polygon points="640,0 700,0 540,320 480,320" fill="#22d3ee" opacity="0.15"/>

  <circle cx="1080" cy="70" r="26" fill="none" stroke="#0b1020" stroke-width="4" opacity="0.4"/>
  <polygon points="1130,220 1160,180 1170,230" fill="#0b1020" opacity="0.35"/>

  <text x="60" y="118" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="1" fill="url(#titleGrad)" filter="url(#shadow)">MOHAMMED</text>
  <text x="60" y="182" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="1" fill="url(#titleGrad)" filter="url(#shadow)">ASLAM<tspan fill="#22d3ee"> M</tspan></text>

  <rect x="62" y="204" width="430" height="30" fill="#22d3ee"/>
  <text x="72" y="226" font-family="Arial, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#0b1020">JUNIOR SOFTWARE DEVELOPER · FULL STACK</text>

  <text x="62" y="270" font-family="Arial, sans-serif" font-weight="600" font-size="18" letter-spacing="0.5" fill="#c7d2fe">React.js · Node.js · Express.js · PostgreSQL · Prisma ORM</text>
  <text x="62" y="298" font-family="Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="0.5" fill="#a5b4fc">Shipping SaaS with AI-assisted dev — Cursor · Claude · Antigravity</text>
</svg>
