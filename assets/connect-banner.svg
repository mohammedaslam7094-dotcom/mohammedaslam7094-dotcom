<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots4" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <linearGradient id="emailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="liGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="#0b1020"/>
  <rect width="1200" height="240" fill="url(#dots4)"/>

  <rect x="420" y="24" width="360" height="48" fill="#c084fc"/>
  <text x="600" y="57" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#0b1020">LET'S CONNECT</text>

  <g filter="url(#shadow4)">
    <rect x="120" y="110" width="440" height="90" rx="6" fill="url(#emailGrad)" transform="rotate(-1.5 340 155)"/>
    <text x="340" y="163" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="#0b1020" transform="rotate(-1.5 340 155)">✉ EMAIL ME</text>
  </g>

  <g filter="url(#shadow4)">
    <rect x="640" y="110" width="440" height="90" rx="6" fill="url(#liGrad)" transform="rotate(1.5 860 155)"/>
    <text x="860" y="163" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="#0b1020" transform="rotate(1.5 860 155)">in LINKEDIN</text>
  </g>
</svg>
